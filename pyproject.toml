[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real-estate-referrer"
version = "0.1.0"
description = "Sistema multi-agente que recomienda propiedades a partir de un texto libre del usuario."
requires-python = ">=3.11"
authors = [{ name = "UPB - Técnicas avanzadas de IA" }]
readme = "README.md"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3.12",
    "respx>=0.21",
]

[project.scripts]
real-estate-referrer = "real_estate_referrer.app:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"real_estate_referrer" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src"]
